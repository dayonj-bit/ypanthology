@font-face{font-family:"Pretendard";src:url(pretendard-sub.woff2) format("woff2");font-weight:45 920;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
:root{--frame:min(100vw,480px);--u:calc(var(--frame) / 402);--red:#C42128}
html{background:#ecebe8}
body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;

body.locked{overflow:hidden;height:100dvh;touch-action:none}
img{display:block;max-width:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.frame{position:relative;width:var(--frame);margin:0 auto;background:#fff;overflow:hidden}
.abs{position:absolute}
.ctr{position:absolute;left:50%;transform:translate(-50%,-50%);white-space:nowrap;line-height:1}
.block{position:relative;width:100%}

/* ===== 등장 애니메이션 ===== */
.rv{opacity:0;transform:translateY(calc(var(--u)*14));transition:opacity .9s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.ctr.rv{transform:translate(-50%,calc(-50% + var(--u)*14))}
.ctr.rv.in{transform:translate(-50%,-50%)}
.deco{opacity:0;transform:scale(.85) rotate(-6deg);transition:opacity .9s ease,transform 1.2s cubic-bezier(.2,.8,.2,1.2)}
.deco.in{opacity:1;transform:none}
.sway{animation:sway 5s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{0%,100%{rotate:0deg}50%{rotate:2.5deg}}
@media (prefers-reduced-motion:reduce){.rv,.deco{transition:none;opacity:1;transform:none}.ctr.rv{transform:translate(-50%,-50%)}.sway{animation:none}}

/* ===== 1. 표지 + 초대글 + 날짜 ===== */
.s1{height:calc(var(--u)*1611)}
.s1 .small{font-size:calc(var(--u)*12);letter-spacing:-.01em}
.para{left:0;right:0;text-align:center;font-size:calc(var(--u)*12);line-height:calc(var(--u)*20);letter-spacing:-.02em}
.bigdate{font-size:calc(var(--u)*24);font-weight:600;letter-spacing:-.01em}
.cal{left:calc(var(--u)*40);width:calc(var(--u)*322);font-size:calc(var(--u)*10.5)}
.cal span{position:absolute;transform:translate(-50%,-50%);line-height:1;font-variant-numeric:tabular-nums}
.cal .on{width:calc(var(--u)*20);height:calc(var(--u)*20);border-radius:50%;background:var(--red);color:#fff;font-weight:700;
         display:flex;align-items:center;justify-content:center}
.cd-l{font-size:calc(var(--u)*11.5);font-weight:500}
.cd-n{font-size:calc(var(--u)*20);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.cd-c{font-size:calc(var(--u)*12);font-weight:600}
.dday{font-size:calc(var(--u)*12)}

         box-shadow:inset 0 calc(var(--u)*4) calc(var(--u)*4) rgba(0,0,0,.17)}

/* ===== 섹션 제목 (리본 + 글자) ===== */

.stitle img{width:calc(var(--u)*90)}
.stitle h2{margin-top:calc(var(--u)*3);font-size:calc(var(--u)*12);font-weight:400;line-height:1.2}

/* ===== 2. 갤러리 ===== */

.gtrack{display:flex;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.gpage{flex:0 0 100%;padding:0 calc(var(--u)*42);display:grid;grid-template-columns:repeat(3,1fr);
       column-gap:calc(var(--u)*8);row-gap:calc(var(--u)*9);align-content:start}
.gpage button{aspect-ratio:101/136;overflow:hidden;background:#eee}
.gpage img{width:100%;height:100%;object-fit:cover;transition:transform .5s}

.dots{display:flex;justify-content:center;gap:calc(var(--u)*4);margin-top:calc(var(--u)*20)}

/* 사진 크게 보기 */
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,10,10,.94);display:flex;align-items:center;justify-content:center;

.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:64px;color:#fff;font-size:26px;opacity:.7}
.lb .prev{left:4px}.lb .next{right:4px}
.lb .cnt{position:absolute;bottom:22px;left:0;right:0;text-align:center;color:#bbb;font-size:12px;letter-spacing:.08em}

/* ===== 3. 영상 ===== */
.vbox{position:relative;display:block;width:100%;aspect-ratio:402/225;background:#111;overflow:hidden}
.vbox svg{position:absolute;left:50%;top:50%;width:calc(var(--u)*56);transform:translate(-50%,-50%);transition:transform .2s}

     width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.85);color:#111;box-shadow:0 1px 6px rgba(0,0,0,.15);
     display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.bgm[hidden]{display:none}
.bgm svg{width:20px;height:20px}
.bgm .m{display:none}.bgm.off .m{display:inline}.bgm.off .w{display:none}
.vlink{display:block;width:max-content;margin:calc(var(--u)*10) auto 0;color:#777;font-size:calc(var(--u)*10);text-decoration:none;
       border-bottom:.5px solid #aaa}

/* ===== 4. 마음 전하실 곳 ===== */

footer{padding:calc(var(--u)*80) 0 calc(var(--u)*40);text-align:center;color:#A3A3A3;font-size:calc(var(--u)*9.5)}

       transition:opacity .25s,transform .25s;white-space:nowrap}

/* ===================== 온보딩 ===================== */
#intro{position:fixed;top:0;left:50%;transform:translateX(-50%);width:var(--frame);height:100dvh;z-index:40;overflow:hidden;
       transition:opacity .9s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro .bg{position:absolute;inset:0;background:#f3eee2 url(bg.webp) center/cover no-repeat;transform:scale(1.04);

.sheet{position:absolute;left:0;right:0;height:50%;pointer-events:none}
.sheet.top{top:0;z-index:2}.sheet.bottom{bottom:0;z-index:1}
.sheet .flat{position:absolute;inset:0;background:rgba(255,255,255,.8)}
.sheet .curlWrap{position:absolute;inset:0;filter:drop-shadow(-2px 3px 5px rgba(40,30,20,.28))}
.sheet .curl{position:absolute;inset:0;visibility:hidden}
.seamShadow{position:absolute;left:0;right:0;top:50%;height:12px;z-index:1;pointer-events:none;
            background:linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,0));transition:opacity .35s}
#intro.opened .seamShadow{opacity:0}
.sticker{position:absolute;left:50%;top:50%;z-index:5;width:168.8px;height:69.6px;
         transform:translate(-50%,-50%) scale(var(--s,1)) rotate(-7.4454deg);cursor:grab;touch-action:none;outline:none}
.sticker .hit{position:absolute;inset:-14px}
.layer{position:absolute;left:0;top:0;width:168.8px;height:69.6px;transform-origin:0 0}
.face,.back{width:100%;height:100%;border-radius:7.2px;overflow:hidden}
.sticker .flat{filter:drop-shadow(0 1.6px .8px rgba(0,0,0,.23))}
.face svg{display:block;width:100%;height:100%}
.back{background:linear-gradient(115deg,#d2d2d2 0%,#eeeeee 45%,#c9c9c9 100%)}
.flapWrap{filter:drop-shadow(0 2px 3px rgba(0,0,0,.28));pointer-events:none}
.flap{visibility:hidden}
.sticker.fly{transition:transform .7s cubic-bezier(.4,0,.7,.2),opacity .5s ease .2s;opacity:0;
             transform:translate(calc(-50% + 70vw),calc(-50% - 60vh)) scale(var(--s,1)) rotate(28deg)}
.hint .flat .face{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:none}50%{transform:translateY(-1px)}}
@media (prefers-reduced-motion:reduce){#intro .bg{transition:none}.hint .flat .face{animation:none}}
</style>
</head>

<script>
/* ================== 수정할 내용 ================== */
const WEDDING = '2026-12-25T12:00:00-05:00';   // 나이아가라 현지 시각 (12월 EST, UTC-5)
const ACCOUNTS = [
  { title: '큰 신랑측 계좌번호', items: [
    { who: '신랑 예금주 계좌번호', num: '은행 000-0000-0000 (예금주)' },
    { who: '아버님 계좌번호',      num: '은행 000-0000-0000 (예금주)' },
    { who: '어머님 계좌번호',      num: '은행 000-0000-0000 (예금주)' } ] },
  { title: '작은 신랑측 계좌번호', items: [
    { who: '신랑 예금주 계좌번호', num: '은행 000-0000-0000 (예금주)' },
    { who: '아버님 계좌번호',      num: '은행 000-0000-0000 (예금주)' },
    { who: '어머님 계좌번호',      num: '은행 000-0000-0000 (예금주)' } ] }
];
const PHOTOS = [                                            // 9장씩 한 페이지로 나뉨
  ...[1,2,3,4,5,6,7,8,9].map(i => ({ thumb: `g${i}.webp`, full: `full${i}.webp` })),
  ...[1,2,3,4,5,6,7,8].map(i => ({ thumb: `h${i}.webp`, full: `hfull${i}.webp` }))
];
/* ================================================= */

const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800); };

/* ---------- 달력 ---------- */
(() => {
  const cal = $('cal'), cols = [63,109,155,200.5,246,292,338], u = v => `calc(var(--u)*${v})`;
  const put = (txt, x, y, cls) => { const s = document.createElement('span'); s.textContent = txt; if (cls) s.className = cls;
    s.style.left = u(x - 40); s.style.top = u(y - 1200); cal.appendChild(s); };
  ['일','월','화','수','목','금','토'].forEach((d, i) => put(d, cols[i], 1218.5));
  const first = new Date(2026, 11, 1).getDay();
  for (let d = 1; d <= 31; d++){
    const idx = first + d - 1;
    put(d, cols[idx % 7], 1246.5 + Math.floor(idx / 7) * 24, d === 25 ? 'on' : '');
  }
})();

/* ---------- 카운트다운 ---------- */
(() => {
  const target = new Date(WEDDING).getTime(), p = n => String(n).padStart(2, '0');
  const tick = () => {
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    const d = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600); s %= 3600;
    const set = (id, v) => { const el = $(id); if (el.textContent === v) return; el.textContent = v;
      if (reduce) return; el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); };
    set('cdD', p(d)); set('cdH', p(h)); set('cdM', p(Math.floor(s / 60))); set('cdS', p(s % 60));
    $('dday').querySelector('b').textContent = d;
  };
  tick(); setInterval(tick, 1000);
})();

/* ---------- 갤러리 ---------- */
(() => {
  const track = $('gtrack'), dots = $('dots'), view = $('gview');
  const pages = []; for (let i = 0; i < PHOTOS.length; i += 9) pages.push(PHOTOS.slice(i, i + 9));
  pages.forEach((pg, pi) => {
    const el = document.createElement('div'); el.className = 'gpage';
    pg.forEach((ph, j) => {
      const b = document.createElement('button'); b.setAttribute('aria-label', `사진 ${pi*9 + j + 1} 크게 보기`);
      b.innerHTML = `<img src="${ph.thumb}" alt="" loading="lazy">`;
      b.onclick = () => openLb(pi*9 + j);
      el.appendChild(b);
    });
    track.appendChild(el);
    const dot = document.createElement('i'); dots.appendChild(dot);
  });
  if (pages.length < 2) dots.style.visibility = 'hidden';
  let cur = 0;
  const go = i => { cur = Math.max(0, Math.min(pages.length - 1, i));
    track.style.transform = `translateX(${-100 * cur}%)`;
    [...dots.children].forEach((d, k) => d.classList.toggle('on', k === cur)); };
  go(0);
  // 손가락(또는 마우스)으로 끌면 따라오다가 넘어감
  let sx = null, sy = null, dx = 0, horiz = null;
  view.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; dx = 0; horiz = null; });
  view.addEventListener('pointermove', e => {
    if (sx === null) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (horiz === null && Math.hypot(mx, my) > 8) horiz = Math.abs(mx) > Math.abs(my);
    if (!horiz) return;
    dx = mx; track.style.transition = 'none';
    const edge = (cur === 0 && dx > 0) || (cur === pages.length - 1 && dx < 0) ? .3 : 1;
    track.style.transform = `translateX(calc(${-100 * cur}% + ${dx * edge}px))`;
  });
  const end = () => { if (sx === null) return; track.style.transition = '';
    if (horiz && Math.abs(dx) > view.clientWidth * .18) go(cur + (dx < 0 ? 1 : -1)); else go(cur);
    if (horiz) view._swiped = Date.now(); sx = null; };
  view.addEventListener('pointerup', end); view.addEventListener('pointercancel', end); view.addEventListener('pointerleave', end);
  view.addEventListener('click', e => { if (Date.now() - (view._swiped || 0) < 300) { e.stopPropagation(); e.preventDefault(); } }, true);
  view.addEventListener('dragstart', e => e.preventDefault());
  [...dots.children].forEach((d, k) => d.onclick = () => go(k));

  // 크게 보기
  const lb = $('lb'), img = $('lbImg'); let at = 0;
  const show = i => { at = (i + PHOTOS.length) % PHOTOS.length; img.src = PHOTOS[at].full; $('lbCnt').textContent = `${at + 1} / ${PHOTOS.length}`; };
  window.openLb = i => { show(i); lb.classList.add('open'); document.body.style.overflow = 'hidden'; };
  const close = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };
  $('lbX').onclick = close; $('lbPrev').onclick = () => show(at - 1); $('lbNext').onclick = () => show(at + 1);
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  addEventListener('keydown', e => { if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') show(at - 1); if (e.key === 'ArrowRight') show(at + 1); });
  let lx = null;
  lb.addEventListener('touchstart', e => { lx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', e => { if (lx === null) return; const dx = e.changedTouches[0].clientX - lx;
    if (Math.abs(dx) > 40) show(at + (dx < 0 ? 1 : -1)); lx = null; });
})();

/* ---------- 영상 = BGM ----------
   스티커를 떼는 순간(사용자 터치)에 영상을 소리와 함께 재생 시작.
   브라우저가 소리 재생을 막으면 음소거로 재생하고 오른쪽 위 스피커 버튼으로 켤 수 있게 함. */
const VIDEO_ID = 'TU0q9CW3Xmo';
const video = (() => {
  const box = $('vbox'), btn = $('bgm');
  let frame = null, state = -1, muted = false, fellBack = false;
  const cmd = (func, args = []) => frame && frame.contentWindow &&
    frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*');
  const paint = () => { btn.classList.toggle('off', muted); btn.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기'); };
  addEventListener('message', e => {
    if (!frame || e.source !== frame.contentWindow) return;
    let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch { return; }
    const info = d && d.info; if (!info) return;
    if (typeof info.playerState === 'number') state = info.playerState;
    if (typeof info.muted === 'boolean') { muted = info.muted; paint(); }
  });
  function start(){                                   // 반드시 터치 이벤트 안에서 호출
    if (frame) return;
    frame = document.createElement('iframe');
    frame.src = `https://www.youtube-nocookie.com/embed/${VIDEO_ID}?enablejsapi=1&autoplay=1&playsinline=1&rel=0&loop=1&playlist=${VIDEO_ID}&origin=${encodeURIComponent(location.origin)}`;
    frame.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen'; frame.allowFullscreen = true; frame.title = 'YouTube 영상';
    frame.addEventListener('load', () => {
      const hello = () => frame.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1 }), '*');
      hello(); setTimeout(hello, 500);
      setTimeout(() => { cmd('unMute'); cmd('setVolume', [100]); cmd('playVideo'); }, 400);
      // 3초 안에 재생이 안 되면(소리 자동재생 차단) 음소거로라도 재생
      setTimeout(() => { if (state !== 1){ fellBack = true; cmd('mute'); cmd('playVideo'); muted = true; paint(); } }, 3000);
    });
    box.appendChild(frame);
  }
  btn.addEventListener('click', () => {
    if (!frame) { start(); return; }
    if (muted || state !== 1){ cmd('unMute'); cmd('setVolume', [100]); cmd('playVideo'); muted = false; }
    else { cmd('mute'); muted = true; }
    paint();
  });
  box.addEventListener('click', start);
  return { start, show: () => { btn.hidden = false; paint(); } };
})();

/* ---------- 계좌번호 ---------- */
(() => {
  const root = $('accounts');
  ACCOUNTS.forEach((g, gi) => {
    const acc = document.createElement('div'); acc.className = 'acc rv';
    acc.innerHTML = `<button class="acc-h" aria-expanded="false"><span>${g.title}</span>
      <svg viewBox="333 2647 13 7" aria-hidden="true"><path d="M333 2647L339.5 2654L346 2647" stroke-width="1.2" stroke="black" fill="none"/></svg></button>
      <div class="acc-b"><div><ul>${g.items.map((it, i) => `<li><span class="who">${it.who}<span class="num">${it.num}</span></span>
      <button class="copy" data-g="${gi}" data-i="${i}">복사하기</button></li>`).join('')}</ul></div></div>`;
    const h = acc.querySelector('.acc-h');
    h.onclick = () => { const o = acc.classList.toggle('open'); h.setAttribute('aria-expanded', o); };
    root.appendChild(acc);
  });
  root.addEventListener('click', async e => {
    const b = e.target.closest('.copy'); if (!b) return;
    const num = ACCOUNTS[b.dataset.g].items[b.dataset.i].num;
    try { await navigator.clipboard.writeText(num); toast('계좌번호가 복사되었습니다'); }
    catch { toast(num); }
  });
})();

/* ---------- 방명록 (저장·전송 없음: 보내면 안내만 띄우고 비움) ---------- */
(() => {
  const form = $('gbForm'), ta = $('gbText');
  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!ta.value.trim()) { ta.focus(); toast('축하 메시지를 적어 주세요'); return; }
    ta.value = ''; ta.blur();
    toast('축하 메시지가 전송되었습니다');
  });
})();

/* ---------- 스크롤 등장 ---------- */
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const el = e.target; setTimeout(() => el.classList.add('in'), +(el.dataset.d || 0) * (reduce ? 0 : 1)); io.unobserve(el);
}), { rootMargin: '0px 0px -8% 0px' });
function startReveal(){ document.querySelectorAll('.rv, .deco').forEach(el => io.observe(el)); }

/* ================== 온보딩: 스티커 떼기 → 종이 벗기기 ================== */
(() => {
  const intro = $('intro'), sticker = $('sticker'), flat = $('sFlat'), flap = $('sFlap');
  const W = 168.8, H = 69.6, TH = -7.4454 * Math.PI / 180;
  const fit = () => intro.style.setProperty('--s', intro.clientWidth / 402);
  fit(); addEventListener('resize', fit);

  const RECT = [[0,0],[W,0],[W,H],[0,H]];
  function clipHalf(poly, M, n, keepPositive){
    const side = p => ((p[0]-M[0])*n[0] + (p[1]-M[1])*n[1]) * (keepPositive ? 1 : -1);
    const out = [];
    for (let i = 0; i < poly.length; i++){
      const a = poly[i], b = poly[(i+1) % poly.length], sa = side(a), sb = side(b);
      if (sa >= 0) out.push(a);
      if ((sa >= 0) !== (sb >= 0)){ const t = sa / (sa - sb); out.push([a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t]); }
    }
    return out;
  }
  const toClip = poly => poly.length < 3 ? 'polygon(0 0,0 0,0 0)'
    : 'polygon(' + poly.map(p => p[0].toFixed(2)+'px '+p[1].toFixed(2)+'px').join(',') + ')';

  // 스티커: 모서리 C를 P까지 끌어 접기
  function render(C, P){
    const dx = C[0]-P[0], dy = C[1]-P[1], len = Math.hypot(dx, dy);
    if (len < 0.5){ flat.style.clipPath = 'none'; flap.style.visibility = 'hidden'; return; }
    const n = [dx/len, dy/len], M = [(C[0]+P[0])/2, (C[1]+P[1])/2];
    flat.style.clipPath = toClip(clipHalf(RECT, M, n, false));
    const src = clipHalf(RECT, M, n, true), k = 2 * (M[0]*n[0] + M[1]*n[1]);
    const a = 1 - 2*n[0]*n[0], b = -2*n[0]*n[1], d = 1 - 2*n[1]*n[1];
    flap.style.transform = `matrix(${a},${b},${b},${d},${k*n[0]},${k*n[1]})`;
    flap.style.clipPath = toClip(src);
    flap.style.visibility = src.length >= 3 ? 'visible' : 'hidden';
  }
  const toLocal = (dx, dy) => { const s = intro.clientWidth / 402, c = Math.cos(-TH), si = Math.sin(-TH);
    return [(dx*c - dy*si)/s, (dx*si + dy*c)/s]; };

  let state = 'idle', C = null, start = null, P = null, moved = false;
  sticker.addEventListener('pointerdown', e => {
    if (state !== 'idle') return;
    sticker.classList.remove('hint'); sticker.setPointerCapture(e.pointerId);
    const r = sticker.getBoundingClientRect();
    const [lx, ly] = toLocal(e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2));
    C = [lx > 0 ? W : 0, ly > 0 ? H : 0]; start = [e.clientX, e.clientY]; P = C.slice(); moved = false; state = 'drag';
  });
  sticker.addEventListener('pointermove', e => {
    if (state !== 'drag') return;
    const [dx, dy] = toLocal(e.clientX - start[0], e.clientY - start[1]);
    if (Math.hypot(dx, dy) > 4) moved = true;
    P = [C[0] + dx, C[1] + dy]; render(C, P);
  });
  const release = () => {
    if (state !== 'drag') return;
    if (!moved){ C = [W, 0]; peel([W, 0]); return; }
    Math.hypot(P[0]-C[0], P[1]-C[1]) > W * 0.32 ? peel(P) : springBack();
  };
  sticker.addEventListener('pointerup', release);
  sticker.addEventListener('pointercancel', release);
  sticker.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && state === 'idle'){ e.preventDefault(); sticker.classList.remove('hint'); C = [W,0]; peel([W,0]); }
  });

  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  function tween(from, to, ms, ease, done){
    const t0 = performance.now();
    const step = now => { const t = Math.min(1, (now - t0) / ms), k = ease(t);
      P = [from[0] + (to[0]-from[0])*k, from[1] + (to[1]-from[1])*k]; render(C, P);
      t < 1 ? requestAnimationFrame(step) : done && done(); };
    requestAnimationFrame(step);
  }
  function springBack(){ state = 'anim'; tween(P, C, 280, easeOut, () => { render(C, C); state = 'idle'; }); }
  function peel(from){
    state = 'anim';
    video.start();
    if (navigator.vibrate) try { navigator.vibrate(12); } catch(_){}
    const opp = [W - C[0], H - C[1]], end = [C[0] + (opp[0]-C[0])*1.08, C[1] + (opp[1]-C[1])*1.08];
    tween(from, end, reduce ? 1 : 620, easeInOut, () => {
      sticker.classList.add('fly');
      setTimeout(open, reduce ? 0 : 260);
      setTimeout(() => sticker.remove(), 900);
    });
  }

  // 종이: 모서리부터 대각선으로 접히며 벗겨짐
  function peelSheet(sheet, corner, delay, ms){
    const flatEl = sheet.querySelector('.flat'), curl = sheet.querySelector('.curl');
    return new Promise(done => {
      const w = sheet.clientWidth, h = sheet.clientHeight, rect = [[0,0],[w,0],[w,h],[0,h]];
      const C = [corner[0]*w, corner[1]*h], O = [w - C[0], h - C[1]];
      const end = [C[0] + (O[0]-C[0])*2.15, C[1] + (O[1]-C[1])*2.15];
      const ease = t => -(Math.cos(Math.PI * t) - 1) / 2;
      const t0 = performance.now() + delay;
      const step = now => {
        const t = Math.max(0, Math.min(1, (now - t0) / ms));
        if (t > 0){
          const k = ease(t), P = [C[0] + (end[0]-C[0])*k, C[1] + (end[1]-C[1])*k];
          const dx = C[0]-P[0], dy = C[1]-P[1], len = Math.hypot(dx, dy);
          const n = [dx/len, dy/len], M = [(C[0]+P[0])/2, (C[1]+P[1])/2];
          flatEl.style.clipPath = toClip(clipHalf(rect, M, n, false));
          const dM = 2*(M[0]*n[0] + M[1]*n[1]);
          const src = clipHalf(rect, M, n, true).map(([x,y]) => { const s = 2*(x*n[0] + y*n[1]) - dM; return [x - s*n[0], y - s*n[1]]; });
          curl.style.clipPath = toClip(src);
          curl.style.visibility = src.length >= 3 ? 'visible' : 'hidden';
          const dd = [-n[0], -n[1]], ang = Math.atan2(dd[0], -dd[1]) * 180 / Math.PI, rad = ang * Math.PI / 180;
          const L = Math.abs(w*Math.sin(rad)) + Math.abs(h*Math.cos(rad));
          const s0 = (M[0]-w/2)*dd[0] + (M[1]-h/2)*dd[1] + L/2;
          curl.style.background = `linear-gradient(${ang}deg, rgba(255,255,255,.80) 0px, rgba(255,255,255,.80) ${s0}px,
            rgba(222,218,210,.94) ${s0}px, rgba(250,249,246,.93) ${s0+26}px, rgba(255,255,255,.90) ${s0+90}px, rgba(244,242,237,.92) ${L}px)`;
        }
        t < 1 ? requestAnimationFrame(step) : (sheet.style.visibility = 'hidden', done());
      };
      requestAnimationFrame(step);
    });
  }

  function open(){
    intro.classList.add('opened');
    const ms = reduce ? 1 : 1500;
    Promise.all([
      peelSheet($('sTop'), [1, 1], 0, ms),
      peelSheet($('sBot'), [0, 0], reduce ? 0 : 320, ms)
    ]).then(() => setTimeout(enterMain, reduce ? 0 : 650));
  }
  function enterMain(){
    scrollTo(0, 0);
    document.body.classList.remove('locked');
    intro.classList.add('gone');
    startReveal();
    video.show();
    setTimeout(() => intro.remove(), 1000);
  }
  render([W,0],[W,0]);
})();
</script>
</body>
</html>
